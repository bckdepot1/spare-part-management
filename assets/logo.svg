        <rect x="-3.4" y="13" width="6.8" height="9" rx="1.5" transform="rotate(45)"/>
        <rect x="-22" y="-3.4" width="9" height="6.8" rx="1.5" transform="rotate(45)"/>
        <rect x="13" y="-3.4" width="9" height="6.8" rx="1.5" transform="rotate(45)"/>
